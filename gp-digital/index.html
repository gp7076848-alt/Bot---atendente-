<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GP Digital | Atendimento</title>

  <meta
    name="description"
    content="Atendimento online da GP Digital - Artes, vídeos, sites, bots e soluções digitais."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- TOPO -->
    <header class="topo">

      <div class="logo">
        <div class="gp">GP</div>
        <div class="linha"></div>
        <div class="digital">DIGITAL</div>
      </div>

      <div class="empresa">
        <h1>GP Digital</h1>
        <p>Soluções digitais para o seu negócio</p>
      </div>

      <div class="status">
        <span></span> Online
      </div>

    </header>


    <!-- ÁREA DO CHAT -->
    <main class="chat" id="chat"></main>


    <!-- INDICADOR DIGITANDO -->
    <div class="digitando" id="digitando">
      <span></span>
      <span></span>
      <span></span>
    </div>


    <!-- BOTÕES -->
    <div class="opcoes" id="opcoes"></div>


    <!-- CAMPO DE TEXTO -->
    <form class="entrada" id="formulario">

      <input
        type="text"
        id="mensagem"
        placeholder="Digite sua resposta..."
        autocomplete="off"
      >

      <button type="submit">
        ➤
      </button>

    </form>


    <footer>
      GP DIGITAL • ARTES • VÍDEOS • SITES • BOTS
    </footer>

  </div>


  <script src="script.js"></script>

</body>
</html>
